# 先构建 Starbridge，再将 command 改为宿主二进制的绝对路径。
# 将此表加入客户端配置；此示例不会自动安装 helper 或修改客户端设置。
[mcp_servers.starbridge]
command = "/absolute/project/bin/starbridge"
args = ["serve"]
startup_timeout_sec = 20
tool_timeout_sec = 45

# 默认只有基础只读工具。VM 电源写工具另需 --allow-vm-write。
# 开发读取工具：将 args 改为 ["serve", "--developer-tools"]。
# 开发写工具还需 --allow-guest-write；它不授权 VM 电源操作。
# 文件类开发工具需已有的宿主目录，并设置 --developer-workspace。
# 需要按 VM UUID 和工具名限制范围时，设置 --access-policy FILE。
# 完整开关、图片返回和嵌套授权说明见 docs/MCP_DEVELOPER.md。
