name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Validate release packaging contracts
        run: ./tests/release/package-release-test.sh
      - run: go test -race ./...
      - run: go vet ./...

  guest-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: '& .\tests\windows\guest-smoke.ps1'
      - name: Run installed developer module synthetic contracts
        shell: powershell
        run: '& .\tests\windows\run-developer-contracts.ps1'
      - name: Parse opt-in desktop acceptance scripts
        shell: powershell
        run: |
          Get-ChildItem tests/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($_.Name + ": " + ($errors.Message -join "; ")) }
          }

  publish:
    needs: [host-contracts, guest-contracts]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Build paired distribution packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"
      - name: Publish tested tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set --
          # Build metadata may contain hyphens without making a prerelease.
          case "${RELEASE_TAG%%+*}" in
            *-*) set -- --prerelease ;;
          esac
          set -- "$@" --verify-tag
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes_file" ]; then
            set -- "$@" --notes-file "$notes_file"
          else
            set -- "$@" --generate-notes
          fi
          gh release create "$RELEASE_TAG" "$@" \
            --title "Starbridge $RELEASE_TAG" \
            dist/*.tar.gz dist/checksums.txt
