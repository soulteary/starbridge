name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go host contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run static checks
        run: go vet ./...
      - name: Build CLI and MCP binary
        run: go build -o bin/starbridge ./cmd/starbridge
      - name: Validate release packaging without compilation or publication
        run: ./tests/release/package-release-test.sh

  windows-guest:
    name: Windows PowerShell 5.1 guest contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse helper and run guest smoke tests
        shell: powershell
        run: '& .\tests\windows\guest-smoke.ps1'

      - name: Run installed developer module synthetic contracts
        shell: powershell
        run: |
          $contracts = Get-ChildItem tests/windows/developer-*.ps1 -File |
            Where-Object { $_.Name -match '^developer-(contract|tasks|files|bootstrap|.+-contract)\.ps1$' } |
            Sort-Object Name
          foreach ($contract in $contracts) {
            Write-Host ('Running synthetic contract: ' + $contract.Name)
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $contract.FullName
            if ($LASTEXITCODE -ne 0) { throw ('Synthetic contract failed: ' + $contract.Name) }
          }

      - name: Parse opt-in desktop acceptance scripts
        shell: powershell
        run: |
          Get-ChildItem tests/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($_.Name + ": " + ($errors.Message -join "; ")) }
          }
